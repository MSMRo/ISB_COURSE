[project]
name = "isb-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MSMRo", email = "moises.meza@upch.pe" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "isb-lib",
    "matplotlib>=3.11.2",
    "matplotlib-inline>=0.2.2",
    "neurokit2>=0.3.0",
    "numpy>=2.5.4",
    "opensignalsreader",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sympy>=1.14.0",
]

[project.scripts]
isb-course = "isb_course:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
isb-lib = { git = "https://github.com/MSMRo/ISB_LIB.git" }
opensignalsreader = { path = "src/opensignalsreader", editable = true }
